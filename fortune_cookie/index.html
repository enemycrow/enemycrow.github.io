<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Google Tag Manager -->
  <script src="/js/gtm-loader.js?v=2" defer></script>
  <!-- End Google Tag Manager -->
  <meta charset="UTF-8">
  <meta http-equiv="Cross-Origin-Opener-Policy" content="same-origin">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; connect-src 'self' https://www.googletagmanager.com https://www.google-analytics.com; font-src 'self' https://fonts.gstatic.com https://use.fontawesome.com; frame-src https://www.googletagmanager.com; img-src 'self' data: https://www.googletagmanager.com https://plumafarollama.com https://mirrors.creativecommons.org; object-src 'none'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; require-trusted-types-for 'script'; trusted-types default goog#html 'allow-duplicates';">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7f3ee">
  <meta name="description" content="Abre una galleta y encuentra un mensaje para acompañar tu día, de Marsheeall, Sharkody & Co.">
  <title>Galletas de la fortuna | La Pluma, el Faro y la Llama</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Lora:wght@400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Lora:wght@400;500;600&display=swap"></noscript>
  <link rel="stylesheet" href="fortune.css?v=4">
</head>
<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NX2C8N3W" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <!-- End Google Tag Manager (noscript) -->

  <main class="fortune-app">
    <div class="cookie-stage" aria-live="polite">
      <button id="cookieButton" class="cookie-button" aria-expanded="false" aria-controls="fortune-panel" type="button">
        <span class="sr-only">Abrir galleta de la fortuna</span>
        <span class="cookie-instruction" aria-hidden="true">Abre tu mensaje</span>
        <img src="/fortune_cookie/assets/cookie-closed.svg?v=3" alt="" class="cookie cookie--closed">
        <img src="/fortune_cookie/assets/cookie-open.svg?v=3" alt="" class="cookie cookie--open" aria-hidden="true">
      </button>
    </div>

    <section id="fortune-panel" class="fortune-panel" aria-hidden="true" aria-label="Tu mensaje de fortuna">
      <div class="fortune-card">
        <span class="fortune-card__icon" aria-hidden="true">✦</span>
        <blockquote id="fortuneMessage" class="fortune-message">
          <p></p>
          <cite id="fortuneAuthor"></cite>
        </blockquote>
      </div>

      <div class="fortune-details">
        <div class="fortune-author" id="fortuneAvatar" aria-label="Autor">
          <img id="fortuneAvatarImage" alt="" hidden>
          <span id="fortuneAvatarInitials" aria-hidden="true"></span>
        </div>
        <div class="fortune-image" id="fortuneImageWrapper">
          <img id="fortuneImage" alt="Ilustración de la fortuna" loading="lazy">
          <p class="fortune-stamp">Marsheeall, Sharkody & Co.</p>
        </div>
        <div class="fortune-tags" id="fortuneTags" aria-label="Etiquetas"></div>
        <time id="fortuneDate" class="fortune-date" datetime=""></time>
      </div>

      <div class="fortune-actions">
        <button id="anotherFortune" class="pill-button" type="button">Otra fortuna <span aria-hidden="true">↗</span></button>
        <button id="shareFortune" class="pill-button pill-button--secondary" type="button">Compartir</button>
      </div>
    </section>
  </main>

  <section class="fortune-error" id="fortuneError" aria-live="polite" hidden>
    <p>Ahora mismo no podemos encontrar las galletitas. Probemos otra vez.</p>
    <button id="retryLoad" class="pill-button" type="button">Reintentar</button>
  </section>

  <template id="tagTemplate">
    <span class="fortune-chip"></span>
  </template>

  <script src="fortune.js?v=4" type="module"></script>
  <!-- Dev helper: limpiar service workers y caché únicamente en localhost. -->
  <script>
    (function () {
      try {
        if (location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') return;
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(reg => reg.unregister()));
        }
        if (window.caches && caches.keys) {
          caches.keys().then(keys => keys.forEach(key => caches.delete(key)));
        }
      } catch (error) {
        console.warn('Dev: no se pudo limpiar la caché local.', error);
      }
    })();
  </script>
</body>
</html>
